<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Fırsat AI ile ürün fiyatlarını karşılaştırın, fırsatları ve fiyat düşüşlerini keşfedin."
    >

    <title>{% block title %}Fırsat AI{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css?v=5"
    >

    <style>
        body {
            min-height: 100vh;
            background: #f5f7fb;
        }

        .public-navbar {
            border-bottom: 1px solid rgba(15, 23, 42, .08);
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(16px);
        }

        .public-navbar .navbar-brand {
            color: #111827;
            font-size: 1.25rem;
            font-weight: 950;
            letter-spacing: -.04em;
        }

        .public-navbar .navbar-brand span {
            color: #2667ff;
        }

        .public-navbar .nav-link {
            color: #475569;
            font-size: .82rem;
            font-weight: 800;
        }

        .public-navbar .nav-link:hover {
            color: #2667ff;
        }

        .public-search-button {
            display: inline-flex;
            min-height: 40px;
            align-items: center;
            padding: 0 15px;
            border-radius: 11px;
            background: #2667ff;
            color: #fff !important;
        }

        .public-footer {
            margin-top: 42px;
            padding: 32px 0;
            border-top: 1px solid #e2e8f0;
            background: #fff;
            color: #64748b;
            font-size: .75rem;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg public-navbar sticky-top">
    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand" href="/">
            Fırsat <span>AI</span>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#publicNavbar"
            aria-controls="publicNavbar"
            aria-expanded="false"
            aria-label="Menüyü aç"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="publicNavbar"
        >
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <a class="nav-link" href="/">
                    Ana sayfa
                </a>

                <a class="nav-link" href="/kategoriler">
                    Kategoriler
                </a>

                <a class="nav-link" href="/firsatlar">
                    Fırsatlar
                </a>

                <a class="nav-link" href="/fiyati-dusenler">
                    Fiyatı düşenler
                </a>

                <a class="nav-link" href="/ai-tavsiyeleri">
                    AI tavsiyeleri
                </a>

                <a class="nav-link public-search-button" href="/arama">
                    Ürün karşılaştır
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="container-fluid px-3 px-lg-4 py-4">
    {% block content %}{% endblock %}
</main>

<footer class="public-footer">
    <div class="container-fluid px-3 px-lg-4">
        <div class="d-flex flex-wrap justify-content-between gap-2">
            <span>© Fırsat AI</span>
            <span>Fiyatları karşılaştır, en iyi fırsatı bul.</span>
        </div>
    </div>
</footer>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

{% block extra_scripts %}{% endblock %}

</body>
</html>
