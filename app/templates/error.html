{% extends "public_base.html" %}
{% block title %}{{ status_code }} · Fırsat AI{% endblock %}
{% block meta_robots %}noindex,nofollow{% endblock %}
{% block content %}
<section class="error-page-shell"><div class="error-page-card"><div class="error-code">{{ status_code }}</div><div class="error-icon">{{ icon }}</div><h1>{{ heading }}</h1><p>{{ message }}</p><div class="error-actions"><a href="/" class="error-primary">Ana sayfaya dön</a><a href="/arama" class="error-secondary">Ürün ara</a></div></div></section>
<style>.error-page-shell{min-height:62vh;display:grid;place-items:center;padding:48px 16px}.error-page-card{width:min(620px,100%);padding:48px;text-align:center;background:#fff;border:1px solid #e7eaf3;border-radius:28px;box-shadow:0 24px 70px rgba(38,52,110,.12)}.error-code{font-size:.85rem;font-weight:900;color:#5b55f7;letter-spacing:.18em}.error-icon{font-size:4rem;margin:12px}.error-page-card h1{font-size:clamp(1.8rem,4vw,3rem);font-weight:950;letter-spacing:-.04em;color:#10172f}.error-page-card p{color:#68728a;max-width:460px;margin:14px auto 28px}.error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.error-actions a{text-decoration:none;padding:13px 20px;border-radius:13px;font-weight:850}.error-primary{background:#5146f7;color:#fff}.error-secondary{border:1px solid #dfe3ef;color:#303a55;background:#fff}</style>
{% endblock %}
