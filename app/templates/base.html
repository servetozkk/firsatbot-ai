<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}Fırsat AI{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css?v=4"
    >

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-3 px-lg-4">

        <a
            class="navbar-brand fw-bold"
            href="/admin"
        >
            Fırsat AI
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#adminNavbar"
            aria-controls="adminNavbar"
            aria-expanded="false"
            aria-label="Menüyü aç"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="adminNavbar"
        >
            <div class="navbar-nav ms-auto align-items-lg-center">

                <a class="nav-link" href="/admin">
                    Dashboard
                </a>

                <a class="nav-link" href="/admin/products">
                    Ürünler
                </a>

                <a class="nav-link" href="/admin/products/add">
                    ➕ Ürün Ekle
                </a>

                <a class="nav-link" href="/admin/categories">
                    Kategoriler
                </a>

                <a class="nav-link" href="/karsilastir">
                    Ürün Grupları
                </a>

                <a class="nav-link" href="/admin/product-features">
                    Özellikler
                </a>

                <a class="nav-link" href="/admin/whatsapp">
                    WhatsApp Fırsatları
                </a>

                <a
                    class="nav-link"
                    href="/docs"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    API
                </a>

            </div>
        </div>

    </div>
</nav>

<main class="container-fluid px-3 px-lg-4 py-4">
    {% block content %}{% endblock %}
</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

{% block extra_scripts %}{% endblock %}

</body>
</html>
