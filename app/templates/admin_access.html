<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Erişimi</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;font-family:Arial,sans-serif}.box{width:min(390px,calc(100% - 32px));padding:28px;border:1px solid #dbe4ef;border-radius:18px;background:#fff;box-shadow:0 20px 60px #1e293b18}.k{font-size:12px;font-weight:900;color:#4f46e5;letter-spacing:.12em}.box input,.box button{box-sizing:border-box;width:100%;height:44px;margin:10px 0;border-radius:9px}.box input{padding:0 12px;border:1px solid #cbd5e1}.box button{border:0;background:#2563eb;color:#fff;font-weight:900}.err{padding:9px;border-radius:8px;background:#fee2e2;color:#b91c1c}</style></head><body><form class="box" method="post" action="/admin/access"><span class="k">FIRSAT AI · GÜVENLİ YÖNETİM</span><h1>Admin erişimi</h1><p>Production erişim anahtarını gir.</p>{% if error %}<div class="err">{{ error }}</div>{% endif %}<input type="password" name="access_token" required><input type="hidden" name="next_url" value="{{ next_url }}"><button>Güvenli giriş</button></form></body></html>
